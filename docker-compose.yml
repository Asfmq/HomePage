services:
  homepage:
    build: .
    image: asfmqi/homepage:latest
    container_name: homepage-nuxt
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-please-change-this-password}
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret-in-production}
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-/api}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s